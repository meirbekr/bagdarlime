<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <linearGradient id="neonGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00FF87" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Dark modern background rounded container -->
  <rect width="128" height="128" rx="32" fill="#0B0F17" />
  <rect width="126" height="126" x="1" y="1" rx="31" fill="none" stroke="url(#neonGlow)" stroke-width="2" stroke-opacity="0.3" />
  
  <!-- Stylized B and Lime leaf / Neural network tech node -->
  <g filter="url(#glow)">
    <path d="M42 36 L74 36 C86 36 94 43 94 52 C94 58 90 63 83 66 C92 69 96 76 96 84 C96 95 86 102 72 102 L42 102 Z" fill="none" stroke="url(#neonGlow)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" />
    <line x1="42" y1="67" x2="80" y2="67" stroke="url(#neonGlow)" stroke-width="8" stroke-linecap="round" />
    <circle cx="86" cy="40" r="5" fill="#00FF87" />
    <circle cx="94" cy="88" r="4" fill="#00FF87" />
  </g>
</svg>
