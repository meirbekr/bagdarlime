<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070A0F" />
      <stop offset="50%" stop-color="#0B0F17" />
      <stop offset="100%" stop-color="#04060A" />
    </linearGradient>
    <linearGradient id="neonGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00FF87" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>
    <filter id="glowEffect" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="25" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGrad)" />

  <!-- Ambient glowing orbs -->
  <circle cx="200" cy="150" r="280" fill="#00FF87" opacity="0.08" filter="url(#glowEffect)" />
  <circle cx="1050" cy="450" r="320" fill="#10B981" opacity="0.06" filter="url(#glowEffect)" />

  <!-- Grid pattern -->
  <g stroke="rgba(255, 255, 255, 0.04)" stroke-width="1">
    <line x1="0" y1="126" x2="1200" y2="126" />
    <line x1="0" y1="252" x2="1200" y2="252" />
    <line x1="0" y1="378" x2="1200" y2="378" />
    <line x1="0" y1="504" x2="1200" y2="504" />
    <line x1="240" y1="0" x2="240" y2="630" />
    <line x1="480" y1="0" x2="480" y2="630" />
    <line x1="720" y1="0" x2="720" y2="630" />
    <line x1="960" y1="0" x2="960" y2="630" />
  </g>

  <!-- Top Badge -->
  <rect x="100" y="90" width="380" height="38" rx="19" fill="#0F141E" stroke="#00FF87" stroke-opacity="0.4" stroke-width="1.5" />
  <circle cx="124" cy="109" r="5" fill="#00FF87" />
  <text x="142" y="114" fill="#00FF87" font-family="'Space Grotesk', sans-serif" font-size="14" font-weight="600" letter-spacing="1.5">
    IT &amp; AI РЕШЕНИЯ В КАЗАХСТАНЕ
  </text>

  <!-- Logo -->
  <g transform="translate(100, 160)">
    <text font-family="'Space Grotesk', sans-serif" font-size="76" font-weight="800" fill="#FFFFFF">
      Bagdar<tspan fill="#00FF87">Lime</tspan>
    </text>
  </g>

  <!-- H1 Headline -->
  <text x="100" y="320" font-family="'Space Grotesk', sans-serif" font-size="38" font-weight="700" fill="#F1F5F9">
    Разработка ПО, автоматизация бизнеса
  </text>
  <text x="100" y="375" font-family="'Space Grotesk', sans-serif" font-size="38" font-weight="700" fill="url(#neonGrad)">
    и внедрение ИИ под ключ
  </text>

  <!-- Subtitle -->
  <text x="100" y="440" font-family="'Inter', sans-serif" font-size="22" fill="#94A3B8">
    Сайты • Мобильные приложения • CRM/ERP • ИИ-ассистенты
  </text>

  <!-- Footer Info -->
  <g transform="translate(100, 520)">
    <rect width="260" height="46" rx="12" fill="#0F141E" stroke="rgba(255,255,255,0.1)" />
    <text x="24" y="29" font-family="'Inter', sans-serif" font-size="16" font-weight="600" fill="#FFFFFF">
      📍 г. Астана • Казахстан
    </text>

    <rect x="280" y="0" width="280" height="46" rx="12" fill="#00FF87" />
    <text x="310" y="29" font-family="'Inter', sans-serif" font-size="16" font-weight="700" fill="#070A0F">
      💬 +7 (747) 247-07-97
    </text>
  </g>
</svg>
